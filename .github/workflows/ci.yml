name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

# Exact CLI version for every npx supabase call: an unpinned npx resolves "latest" on each run,
# so a new major (3.0.0 shipped 2026-11-02) would change CI with no commit. Bump deliberately.
env:
  SUPABASE_CLI_VERSION: '2.122.1'

# Free-tier Actions minutes: a newer push to a PR supersedes its old run. Never
# cancel on main: each main run's secret scan covers only its own push, so a
# cancelled run would leave those commits unscanned.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # Pinned: ubuntu-latest moved to 26.04, which Playwright does not support.
    runs-on: ubuntu-24.04
    # Secrets cannot be read in a step `if:` (GitHub rejects the whole workflow,
    # which kept CI at 0 jobs for weeks). Derive a flag here and test that.
    env:
      HAS_E2E_LOGIN: ${{ secrets.E2E_LOGIN_EMAIL != '' && secrets.E2E_LOGIN_PASSWORD != '' }}
    steps:
      # Full history: spec:drift diffs against the commit each spec section was
      # stamped at, which a depth-1 checkout does not contain.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Root typecheck
        run: npm run typecheck

      - name: Root tests
        run: npm run test

      - name: Root lint
        run: npm run lint

      - name: Spec tooling tests
        run: npm run spec:test

      - name: Spec drift (advisory until the EU sections are re-stamped)
        continue-on-error: true
        run: npm run spec:drift

      - name: Web typecheck
        run: npm run typecheck
        working-directory: web

      - name: Web lint
        run: npm run lint
        working-directory: web

      - name: Web unit tests
        run: npm run test
        working-directory: web

      - name: Web build
        run: npm run build
        working-directory: web

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Web E2E smoke
        run: npm run test:e2e:smoke
        working-directory: web

      - name: Web E2E authenticated (optional)
        if: env.HAS_E2E_LOGIN == 'true'
        run: npm run test:e2e
        working-directory: web
        env:
          E2E_LOGIN_EMAIL: ${{ secrets.E2E_LOGIN_EMAIL }}
          E2E_LOGIN_PASSWORD: ${{ secrets.E2E_LOGIN_PASSWORD }}

  db-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Start Supabase local DB
        run: npx --yes supabase@${{ env.SUPABASE_CLI_VERSION }} db start

      - name: Apply migrations smoke
        run: npx --yes supabase@${{ env.SUPABASE_CLI_VERSION }} db reset --no-seed

      - name: Run SQL smoke assertions
        run: |
          DB_URL=$(npx --yes supabase@${{ env.SUPABASE_CLI_VERSION }} status --output json | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);console.log(j.DB_URL||j.db_url||'');})")
          psql "$DB_URL" -f scripts/sql/smoke.sql

      - name: Stop Supabase local DB
        if: always()
        run: npx --yes supabase@${{ env.SUPABASE_CLI_VERSION }} stop --no-backup

  rls-integration:
    runs-on: ubuntu-latest
    # Mandatory on every PR (no `if:` gate): the sole automated cross-tenant
    # isolation guard. Runs against a throwaway local Supabase built from this
    # PR's own migrations, so it needs no secrets, no hosted CI project, and
    # cannot drift from the schema under test. Fork PRs run it too.
    # Trade-off: edge functions are not served locally (verify-backend skips
    # that check) and the local stack uses the CLI's public demo JWT keys,
    # which are safe only because the stack lives and dies on this runner.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Start local Supabase (applies every migration on a fresh DB)
        run: npx --yes supabase@${{ env.SUPABASE_CLI_VERSION }} start

      - name: Provision throwaway test users and export test env
        run: |
          set -euo pipefail
          status=$(npx --yes supabase@${{ env.SUPABASE_CLI_VERSION }} status -o env)
          url=$(printf '%s\n' "$status" | sed -n 's/^API_URL="\(.*\)"$/\1/p')
          anon=$(printf '%s\n' "$status" | sed -n 's/^ANON_KEY="\(.*\)"$/\1/p')
          [ -n "$url" ] && [ -n "$anon" ] || { echo "::error::could not read local API_URL/ANON_KEY"; exit 1; }
          for u in A B; do
            pw=$(openssl rand -hex 16)
            echo "::add-mask::$pw"
            email="ci-${u,,}-${GITHUB_RUN_ID}@example.test"
            # Local GoTrue auto-confirms; require a session back so a config
            # change that re-enables email confirmation fails loudly here.
            curl -fsS "$url/auth/v1/signup" -H "apikey: $anon" -H 'Content-Type: application/json' \
              -d "{\"email\":\"$email\",\"password\":\"$pw\"}" | grep -q '"access_token"' \
              || { echo "::error::signup for user $u returned no session (is email confirmation on?)"; exit 1; }
            { echo "E2E_USER_${u}_EMAIL=$email"; echo "E2E_USER_${u}_PASSWORD=$pw"; } >> "$GITHUB_ENV"
          done
          { echo "E2E_SUPABASE_URL=$url"; echo "E2E_SUPABASE_ANON_KEY=$anon"; } >> "$GITHUB_ENV"

      - name: Verify local schema has the required RPCs and revokes
        run: node scripts/verify-backend.mjs

      - name: RLS integration tests
        run: npm test -- rls.integration.test.ts

      - name: Stop local Supabase
        if: always()
        run: npx --yes supabase@${{ env.SUPABASE_CLI_VERSION }} stop --no-backup

  responsive-e2e:
    # Every page × viewport × engine (Chromium/Edge, Firefox, WebKit phone,
    # Chrome phone, WebKit iPad) for overflow, target size and iOS input zoom.
    # Logged-in pages seed throwaway users on a local Supabase built from this
    # PR's migrations, so it needs no secrets and can never touch prod (the spec
    # also refuses any non-local Supabase URL). Uses the dev server (see
    # playwright.config.ts: prod CSP's upgrade-insecure-requests breaks WebKit on
    # http loopback); the spec warms every route before sweeping.
    runs-on: ubuntu-24.04 # Playwright does not support 26.04 yet (see verify)
    timeout-minutes: 50
    env:
      # Ask the ledger on for this job's dev servers: the responsive sweep then
      # also checks the dock fits every viewport, and the chat specs below run.
      # No Anthropic key: the specs mock /api/ledger-chat, so no model is called.
      LEDGER_CHAT_ENABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Start local Supabase (applies every migration on a fresh DB)
        run: npx --yes supabase@${{ env.SUPABASE_CLI_VERSION }} start

      - name: Export local stack env
        run: |
          set -euo pipefail
          status=$(npx --yes supabase@${{ env.SUPABASE_CLI_VERSION }} status -o env)
          get() { printf '%s\n' "$status" | sed -n "s/^$1=\"\(.*\)\"$/\1/p"; }
          url=$(get API_URL); anon=$(get ANON_KEY); service=$(get SERVICE_ROLE_KEY)
          [ -n "$url" ] && [ -n "$anon" ] && [ -n "$service" ] || { echo "::error::could not read local stack env"; exit 1; }
          # CLI demo keys: public and only valid for this runner's throwaway stack.
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$url"; echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$anon"
            echo "E2E_SUPABASE_URL=$url"; echo "E2E_SUPABASE_ANON_KEY=$anon"
            echo "SUPABASE_SERVICE_ROLE_KEY=$service"
          } >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: web

      - name: Responsive E2E
        run: npm run test:e2e:responsive
        working-directory: web
        env:
          E2E_RESPONSIVE: '1'

      # Seeded functional specs on the same throwaway stack (Chromium only).
      # They skip themselves without a seedable stack, so a silent skip here
      # would be a false pass: fail the step if anything was skipped.
      - name: Functional E2E (chat, dock, consent, goals)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          npx playwright test e2e/ledger-chat.spec.ts e2e/ask-dock.spec.ts e2e/consent.spec.ts e2e/consent-chat.spec.ts e2e/goals.spec.ts \
            --reporter=list,json 2>&1 | tee functional.log
          node -e "const r=require('./functional-report.json');const s=r.stats||{};if((s.skipped||0)>0||(s.expected||0)===0){console.error('::error::functional specs skipped or none ran',JSON.stringify(s));process.exit(1)}"
        working-directory: web
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: functional-report.json

      - name: Stop local Supabase
        if: always()
        run: npx --yes supabase@${{ env.SUPABASE_CLI_VERSION }} stop --no-backup

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The scanner is a downloaded binary: keep the token out of .git/config.
          persist-credentials: false

      - name: Install gitleaks (checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks

      - name: Scan new commits (redacted; never prints a secret)
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          # gitleaks exits 0 with no findings when the range base is missing, so a
          # bad base would be a silent pass. Fail loudly instead.
          if ! git rev-parse --verify --quiet "${BASE}^{commit}" >/dev/null; then
            echo "::error::scan base '${BASE}' does not exist; refusing a scan that would silently pass"
            exit 1
          fi
          ./gitleaks git --redact --no-banner --exit-code 1 --log-opts="${BASE}..HEAD"

  audit:
    runs-on: ubuntu-latest
    # Blocking at `critical`, advisory at `high`. Both trees are at 0 critical, so a
    # new critical advisory fails CI. The known high-severity leftovers are advisory:
    #   root: expo-router / @expo/cli / decode-uri-component / query-string (fixed only
    #         by Expo SDK 58), image-size (metro pins ^1; no 1.x is patched), zod
    #   web:  zod
    # zod needs 3 -> 4 together with @hookform/resolvers 5 (the signup/reset forms).
    # Revisit when the Expo SDK or zod migrations land, then tighten to `high`.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Root production dependencies (critical — blocking)
        run: npm audit --omit=dev --audit-level=critical

      - name: Web production dependencies (critical — blocking)
        if: always()
        run: npm audit --omit=dev --audit-level=critical
        working-directory: web

      - name: Root production dependencies (high — advisory)
        if: always()
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Web production dependencies (high — advisory)
        if: always()
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
        working-directory: web
