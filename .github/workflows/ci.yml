name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

# Free-tier Actions minutes: a newer push to a PR supersedes its old run. Never
# cancel on main: each main run's secret scan covers only its own push, so a
# cancelled run would leave those commits unscanned.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # Secrets cannot be read in a step `if:` (GitHub rejects the whole workflow,
    # which kept CI at 0 jobs for weeks). Derive a flag here and test that.
    env:
      HAS_E2E_LOGIN: ${{ secrets.E2E_LOGIN_EMAIL != '' && secrets.E2E_LOGIN_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Root typecheck
        run: npm run typecheck

      - name: Root tests
        run: npm run test

      - name: Root lint
        run: npm run lint

      - name: Spec tooling tests
        run: npm run spec:test

      - name: Spec drift (advisory until the EU sections are re-stamped)
        run: npm run spec:drift

      - name: Web typecheck
        run: npm run typecheck
        working-directory: web

      - name: Web lint
        run: npm run lint
        working-directory: web

      - name: Web unit tests
        run: npm run test
        working-directory: web

      - name: Web build
        run: npm run build
        working-directory: web

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Web E2E smoke
        run: npm run test:e2e:smoke
        working-directory: web

      - name: Web E2E authenticated (optional)
        if: env.HAS_E2E_LOGIN == 'true'
        run: npm run test:e2e
        working-directory: web
        env:
          E2E_LOGIN_EMAIL: ${{ secrets.E2E_LOGIN_EMAIL }}
          E2E_LOGIN_PASSWORD: ${{ secrets.E2E_LOGIN_PASSWORD }}

  db-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Start Supabase local DB
        run: npx supabase db start

      - name: Apply migrations smoke
        run: npx supabase db reset --no-seed

      - name: Run SQL smoke assertions
        run: |
          DB_URL=$(npx supabase status --output json | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);console.log(j.DB_URL||j.db_url||'');})")
          psql "$DB_URL" -f scripts/sql/smoke.sql

      - name: Stop Supabase local DB
        if: always()
        run: npx supabase stop --no-backup

  rls-integration:
    runs-on: ubuntu-latest
    # No `if:` gate — this job is mandatory on every PR.
    # Rationale: rls-integration is the sole automated safety net for
    # cross-tenant data leakage.  Silently skipping it when secrets are
    # absent defeats the purpose; a missing secret should block CI, not
    # green-light it.
    #
    # Concurrency: serialise runs that target the same ref so two PRs
    # cannot race against the shared CI Supabase project.  cancel-in-progress
    # is false because tests clean up probe rows both inline in each it() block
    # AND in an afterAll() hook (added in H5).  An interrupted run will skip
    # the afterAll cleanup, leaving probe rows that the next run treats as
    # noise; flipping to true is therefore acceptable if queue depth becomes
    # the bigger problem, at the cost of some test-row leakage between runs.
    concurrency:
      group: rls-integration-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Verify required E2E secrets
        env:
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_USER_A_EMAIL: ${{ secrets.E2E_USER_A_EMAIL }}
          E2E_USER_A_PASSWORD: ${{ secrets.E2E_USER_A_PASSWORD }}
          E2E_USER_B_EMAIL: ${{ secrets.E2E_USER_B_EMAIL }}
          E2E_USER_B_PASSWORD: ${{ secrets.E2E_USER_B_PASSWORD }}
        run: |
          missing=()
          [ -z "$E2E_SUPABASE_URL" ]       && missing+=("E2E_SUPABASE_URL        — anon-accessible URL of the CI Supabase project")
          [ -z "$E2E_SUPABASE_ANON_KEY" ]  && missing+=("E2E_SUPABASE_ANON_KEY   — anon/public API key of the CI Supabase project")
          [ -z "$E2E_USER_A_EMAIL" ]        && missing+=("E2E_USER_A_EMAIL         — email of pre-created test user A on the CI project")
          [ -z "$E2E_USER_A_PASSWORD" ]     && missing+=("E2E_USER_A_PASSWORD      — password of test user A")
          [ -z "$E2E_USER_B_EMAIL" ]        && missing+=("E2E_USER_B_EMAIL         — email of pre-created test user B on the CI project")
          [ -z "$E2E_USER_B_PASSWORD" ]     && missing+=("E2E_USER_B_PASSWORD      — password of test user B")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets for rls-integration job:"
            printf '  - %s\n' "${missing[@]}"
            echo ""
            echo "See docs/deployment/production-ops-checklist.md section 6 for setup."
            exit 1
          fi
          echo "All required secrets present."

      - name: Verify CI project schema is current
        env:
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
        run: node scripts/verify-backend.mjs

      - name: RLS integration tests
        run: npm test -- rls.integration.test.ts
        env:
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_USER_A_EMAIL: ${{ secrets.E2E_USER_A_EMAIL }}
          E2E_USER_A_PASSWORD: ${{ secrets.E2E_USER_A_PASSWORD }}
          E2E_USER_B_EMAIL: ${{ secrets.E2E_USER_B_EMAIL }}
          E2E_USER_B_PASSWORD: ${{ secrets.E2E_USER_B_PASSWORD }}

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # The scanner is a downloaded binary: keep the token out of .git/config.
          persist-credentials: false

      - name: Install gitleaks (checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks

      - name: Scan new commits (redacted; never prints a secret)
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          # gitleaks exits 0 with no findings when the range base is missing, so a
          # bad base would be a silent pass. Fail loudly instead.
          if ! git rev-parse --verify --quiet "${BASE}^{commit}" >/dev/null; then
            echo "::error::scan base '${BASE}' does not exist; refusing a scan that would silently pass"
            exit 1
          fi
          ./gitleaks git --redact --no-banner --exit-code 1 --log-opts="${BASE}..HEAD"

  audit:
    runs-on: ubuntu-latest
    # Advisory until the Next 14 -> 15 track lands: Next 14 has advisories with no
    # fix on its line, so a blocking audit would be permanently red and ignored.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Root production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Web production dependencies
        if: always()
        run: npm audit --omit=dev --audit-level=high
        working-directory: web
