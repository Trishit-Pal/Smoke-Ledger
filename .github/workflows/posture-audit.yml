name: Weekly security posture audit

# Reports, never fixes. A failed run emails the repo owner; findings go to the
# job summary. Read-only token: no auto-issues (that would need issues: write).
on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install gitleaks (checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks

      - name: Full-history secret scan (redacted)
        run: ./gitleaks git --redact --no-banner --exit-code 1

      - name: Dependency audit (root, then web)
        if: always()
        run: |
          {
            echo '## npm audit (production dependencies)'
            echo '### root'; npm audit --omit=dev --audit-level=high || true
            echo '### web'; (cd web && npm audit --omit=dev --audit-level=high) || true
          } >> "$GITHUB_STEP_SUMMARY"
          npm audit --omit=dev --audit-level=high
          (cd web && npm audit --omit=dev --audit-level=high)
